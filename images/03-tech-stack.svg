<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="Tech stack: languages, frontend, backend and tools">
  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes soft{0%,100%{opacity:.7}50%{opacity:1}}
    .h{animation:fade .5s .1s both}
    .c1{animation:fade .5s .35s both}
    .c2{animation:fade .5s .6s both}
    .c3{animation:fade .5s .85s both}
    .line{animation:soft 2.6s 1s infinite}
  </style>
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="1560" height="440" rx="18" fill="#0a0a12" stroke="#22d3ee" stroke-opacity="0.12"/>

  <text class="h" x="800" y="98" font-size="40" font-weight="700" fill="url(#tg)" letter-spacing="6" text-anchor="middle">TECH STACK</text>
  <line class="line" x1="700" y1="122" x2="900" y2="122" stroke="#22d3ee" stroke-opacity="0.4"/>

  <text class="c1" x="320" y="196" font-size="19" fill="#67e8f9" letter-spacing="4" text-anchor="middle" font-weight="700">LANGUAGES</text>
  <line class="c1" x1="250" y1="212" x2="390" y2="212" stroke="#22d3ee" stroke-opacity="0.3"/>
  <g class="c1" font-size="23" fill="#d6ecf5" text-anchor="middle">
    <text x="320" y="252">Python</text>
    <text x="320" y="294">TypeScript</text>
    <text x="320" y="336">JavaScript</text>
    <text x="320" y="378">HTML · CSS</text>
  </g>

  <text class="c2" x="800" y="196" font-size="19" fill="#67e8f9" letter-spacing="4" text-anchor="middle" font-weight="700">FRONTEND</text>
  <line class="c2" x1="730" y1="212" x2="870" y2="212" stroke="#22d3ee" stroke-opacity="0.3"/>
  <g class="c2" font-size="23" fill="#d6ecf5" text-anchor="middle">
    <text x="800" y="252">React</text>
    <text x="800" y="294">Tailwind CSS</text>
    <text x="800" y="336">Responsive UI</text>
    <text x="800" y="378">PWA</text>
  </g>

  <text class="c3" x="1280" y="196" font-size="19" fill="#67e8f9" letter-spacing="4" text-anchor="middle" font-weight="700">BACKEND &amp; TOOLS</text>
  <line class="c3" x1="1210" y1="212" x2="1350" y2="212" stroke="#22d3ee" stroke-opacity="0.3"/>
  <g class="c3" font-size="23" fill="#d6ecf5" text-anchor="middle">
    <text x="1280" y="252">REST APIs</text>
    <text x="1280" y="294">Python automation</text>
    <text x="1280" y="336">Vercel · Pages</text>
    <text x="1280" y="378">Git &amp; GitHub</text>
  </g>

  <line x1="560" y1="176" x2="560" y2="400" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="1040" y1="176" x2="1040" y2="400" stroke="#ffffff" stroke-opacity="0.05"/>
</svg>
