<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-label="Moses Orji — Full-Stack Engineer building real-world apps with Python, AI and modern tools">
  <defs>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes soft{0%,100%{opacity:.45}50%{opacity:1}}
    .d1{animation:fade .5s .05s both}
    .d2{animation:fade .7s .3s both}
    .d3{animation:fade .7s .65s both}
    .d4{animation:fade .7s .95s both}
    .d5{animation:fade .7s 1.25s both}
    .pulse{animation:soft 2.4s ease-in-out 1.4s infinite}
  </style>
  <rect x="1" y="1" width="1598" height="428" rx="18" fill="#0a0a12"/>
  <rect x="1" y="1" width="1598" height="428" rx="18" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1597" height="427" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.12"/>
  <g text-anchor="middle">
    <text class="d1" x="800" y="96" font-size="20" letter-spacing="6" fill="#67e8f9">FULL-STACK ENGINEER</text>
    <text class="d2" x="800" y="212" font-size="92" font-weight="700" fill="url(#tx)">Moses Orji.</text>
    <line class="d3 pulse" x1="650" y1="248" x2="950" y2="248" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text class="d4" x="800" y="302" font-size="27" fill="#d7edf7">Building real-world apps with Python, AI &amp; modern tools.</text>
    <text class="d5" x="800" y="352" font-size="18" fill="#7a9dab">Lagos, Nigeria — open to collaboration</text>
  </g>
</svg>
