<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="Terminal: whoami, focus, building, mindset">
  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
    .l1{animation:fade .4s .15s both}
    .l2{animation:fade .5s .35s both}
    .l3{animation:fade .4s .7s both}
    .l4{animation:fade .5s .9s both}
    .l5{animation:fade .5s 1.1s both}
    .l6{animation:fade .4s 1.45s both}
    .l7{animation:fade .5s 1.65s both}
    .l8{animation:fade .4s 2s both}
    .l9{animation:fade .5s 2.2s both}
    .lc{animation:fade .4s 2.55s both}
    .blink{animation:bl 1.05s 2.7s infinite}
  </style>
  <rect x="20" y="20" width="1560" height="580" rx="16" fill="#0d1017" stroke="#22d3ee" stroke-opacity="0.14"/>
  <circle cx="56" cy="46" r="6.5" fill="#ff5f57"/>
  <circle cx="76" cy="46" r="6.5" fill="#febc2e"/>
  <circle cx="96" cy="46" r="6.5" fill="#28c840"/>
  <text x="800" y="52" font-size="17" fill="#6f8ea0" text-anchor="middle">moses@github — profile</text>
  <line x1="20" y1="72" x2="1580" y2="72" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-size="22">
    <text class="l1" x="64" y="128" font-size="22" fill="#e6f7fd"><tspan fill="#22d3ee" font-weight="700">$</tspan> whoami</text>
    <text class="l2" x="100" y="172"><tspan fill="#eef9ff" font-weight="700">Moses Orji</tspan><tspan fill="#9fc7d6"> — Full-Stack Engineer | AI</tspan></text>

    <text class="l3" x="64" y="222" fill="#e6f7fd"><tspan fill="#22d3ee" font-weight="700">$</tspan> focus</text>
    <text class="l4" x="100" y="266" fill="#9fc7d6">real-world apps over toy demos</text>
    <text class="l5" x="100" y="310"><tspan fill="#bfe3ee">idea </tspan><tspan fill="#22d3ee">→</tspan><tspan fill="#bfe3ee"> build </tspan><tspan fill="#22d3ee">→</tspan><tspan fill="#bfe3ee"> deploy </tspan><tspan fill="#22d3ee">→</tspan><tspan fill="#bfe3ee"> improve</tspan></text>

    <text class="l6" x="64" y="360" fill="#e6f7fd"><tspan fill="#22d3ee" font-weight="700">$</tspan> building</text>
    <text class="l7" x="100" y="404" fill="#9fc7d6">web apps · fitness tools · fintech-style platforms</text>

    <text class="l8" x="64" y="454" fill="#e6f7fd"><tspan fill="#22d3ee" font-weight="700">$</tspan> mindset</text>
    <text class="l9" x="100" y="498" fill="#bfe3ee">build — ship — improve — repeat</text>

    <text class="lc" x="64" y="548" font-size="22" fill="#22d3ee" font-weight="700">$</text>
    <rect class="lc blink" x="100" y="529" width="13" height="25" fill="#22d3ee"/>
  </g>
</svg>
