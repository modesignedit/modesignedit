<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="120" viewBox="0 0 1600 120" role="img" aria-label="Open my link hub">
  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @keyframes nudge_a{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,0)}}
    .a{animation:nudge_a 1.6s 0.5s infinite}
  </style>
  <rect x="520" y="20" width="560" height="80" rx="40" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
  <text x="790" y="69" font-size="26" font-weight="700" fill="#9ff3ff" letter-spacing="2" text-anchor="middle">OPEN MY LINK HUB</text>
  <g class="a">
    <text x="1042" y="69" font-size="26" font-weight="700" fill="#22d3ee">↗</text>
  </g>
</svg>
