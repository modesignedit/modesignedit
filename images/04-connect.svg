<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-label="Let's connect">
  <style>
    text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Consolas,monospace}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes soft{0%,100%{opacity:.65}50%{opacity:1}}
    .h{animation:fade .5s .1s both}
    .s{animation:fade .5s .4s both}
    .f{animation:fade .5s .7s both}
    .line{animation:soft 2.6s .8s infinite}
  </style>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="1560" height="260" rx="18" fill="#0a0a12" stroke="#22d3ee" stroke-opacity="0.12"/>

  <text class="h" x="800" y="130" font-size="62" font-weight="700" fill="url(#cg)" letter-spacing="3" text-anchor="middle">LET'S CONNECT.</text>
  <line class="line" x1="730" y1="152" x2="870" y2="152" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text class="s" x="800" y="200" font-size="24" fill="#cfe9f5" text-anchor="middle">Open to collaborations, product ideas &amp; real-world builds.</text>
  <text class="f" x="800" y="248" font-size="17" fill="#6f93a5" text-anchor="middle">github.com/modesignedit — link9jatree.vercel.app</text>
</svg>
